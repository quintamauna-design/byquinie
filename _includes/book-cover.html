{%- assign b = include.book -%}
{%- assign w = b.warna | default: "pink" -%}
{%- if w contains "#" %}
<div class="cover" style="--c-bg: {{ w }}">
{%- else %}
<div class="cover cover-{{ w }}">
{%- endif %}
  {%- if b.sampul and b.sampul != "" %}
  <img src="{{ b.sampul | relative_url }}" alt="Sampul {{ b.title }}" loading="lazy">
  {%- else %}
  <svg class="star" aria-hidden="true"><use href="#bintang"/></svg>
  <span class="cover-title">{{ b.title }}</span>
  <span class="cover-author">{{ site.author }}</span>
  {%- endif %}
</div>
