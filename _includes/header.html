<header class="site-header">
  <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav class="site-nav" aria-label="Menu utama">
    {%- assign here = page.url -%}
    <a href="{{ '/' | relative_url }}" {% if here == '/' %}aria-current="page"{% endif %}>Beranda</a>
    <a href="{{ '/tulisan/' | relative_url }}" {% if here == '/tulisan/' or page.layout == 'post' %}aria-current="page"{% endif %}>Tulisan</a>
    <a href="{{ '/tentang/' | relative_url }}" {% if here == '/tentang/' %}aria-current="page"{% endif %}>Tentang</a>
    <button class="theme-toggle" type="button" aria-label="Ganti tema terang/gelap" title="Ganti tema">
      <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </nav>
</header>
