<footer class="site-footer">
  <p class="footer-line">Ditulis pelan-pelan oleh {{ site.author }}.</p>
  <p class="footer-links">
    {%- if site.social.instagram != "" %}<a href="https://instagram.com/{{ site.social.instagram }}">Instagram</a> · {% endif -%}
    {%- if site.social.twitter != "" %}<a href="https://x.com/{{ site.social.twitter }}">X</a> · {% endif -%}
    {%- if site.social.email != "" %}<a href="mailto:{{ site.social.email }}">Surel</a> · {% endif -%}
    <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
  </p>
  <p class="footer-copy">&copy; {{ site.time | date: "%Y" }} {{ site.title }}</p>
</footer>
