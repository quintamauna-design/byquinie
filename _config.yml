# ── Identitas situs ─────────────────────────────────────────
title: byquinie
author: Quinie
tagline: Catatan kecil tentang hal-hal yang terlalu sayang untuk dilupakan.
description: >-
  Ruang menulis Quinie — esai, cerita pendek, puisi, dan catatan
  sehari-hari yang ditulis pelan-pelan.
lang: id

# Alamat website di GitHub Pages: https://quintamauna-design.github.io/byquinie/
# Kalau nanti pakai domain sendiri, ganti url-nya dan kosongkan baseurl.
url: "https://quintamauna-design.github.io"
baseurl: "/byquinie"

# Warna & huruf utama sekarang diatur di _data/tampilan.yml (atau lewat panel admin).
# Bagian ini cadangan kalau _data/tampilan.yml kosong.
#   font   : lora (serif lembut) | garamond (klasik) | inter (modern) | courier (mesin tik)
#   ukuran : 90 | 100 | 110 | 120 | 130  (persen)
tampilan:
  font: inter
  ukuran: 100

# Tautan sosial (kosongkan yang tidak dipakai)
social:
  instagram: ""
  twitter: ""
  email: ""

# ── Pengaturan tulisan ──────────────────────────────────────
permalink: /:year/:month/:title/
excerpt_separator: <!--more-->
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  smart_quotes: lsquo,rsquo,ldquo,rdquo

collections:
  novel:
    output: true
    permalink: /novel/:name/
  bab:
    output: true
    permalink: /baca/:name/

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: novel }
    values: { layout: novel }
  - scope: { path: "", type: bab }
    values: { layout: bab }
  - scope: { path: "tentang.md" }
    values: { layout: page, permalink: /tentang/ }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
